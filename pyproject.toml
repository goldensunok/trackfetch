[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackfetch"
version = "1.0.2"
description = "Multi-provider file search, retrieval and download manager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Trackfetch" }]

dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "paramiko>=3.4",
    "keyring>=25.0",
    "platformdirs>=4.2",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pytest-timeout>=2.3",
]

[project.gui-scripts]
trackfetch = "trackfetch.__main__:main"

[tool.setuptools.packages.find]
include = ["trackfetch*"]

[tool.setuptools.package-data]
trackfetch = ["storage/*.sql", "resources/*"]

[tool.pytest.ini_options]
markers = [
  "slow: a full-size run against the stand-in Soulseek server",
]
testpaths = ["tests"]
addopts = "-q"
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]
